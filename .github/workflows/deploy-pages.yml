name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

# Serialize releases; retain the newest pending run without interrupting a deployment.
# A skipped dispatch on another branch must not replace a pending main release.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    env:
      VITE_INCLUDE_DRAFTS: 'false'
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify protected content and draft-safe environment
        run: node scripts/check-release.mjs

      - name: Type-check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit and component tests
        run: npm run test

      - name: Validate technical writing content
        run: npm run content:check

      - name: Build production artifact once
        run: npm run build

      - name: Install Playwright Chromium and system dependencies
        run: npx playwright install --with-deps chromium

      - name: Test the production artifact
        run: node scripts/run-e2e.mjs

      - name: Verify production assets and draft exclusion
        run: node scripts/check-release.mjs --artifact

      - name: Read Pages configuration
        uses: actions/configure-pages@v5
        with:
          enablement: false

      - name: Upload validated site
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist/

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy validated site
        id: deployment
        uses: actions/deploy-pages@v4
